name: SundialMobile
options:
  bundleIdPrefix: dev.sanchit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Sundial:
    path: ../
targets:
  SundialMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Sundial
        product: SundialCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sanchit.sundial.mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sundial
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
