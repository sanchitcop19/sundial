name: SundialMobile
options:
  bundleIdPrefix: dev.sanchit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Sundial:
    path: ../
targets:
  SundialMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Sundial
        product: SundialCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sanchit.sundial.mobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Xcode Cloud signs with cloud-managed certificates for this team.
        DEVELOPMENT_TEAM: 6FBCL8RW44
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sundial
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption beyond what iOS provides, so TestFlight builds skip
        # the export-compliance question and reach testers unattended.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # A shared scheme: Xcode Cloud can only build schemes committed with the project.
    scheme: {}
